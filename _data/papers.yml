- id: beyond-cls
  title: "Beyond [CLS]: Exploring the True Potential of Masked Image Modeling Representations"
  authors: "Marcin Przewięźlikowski, Randall Balestriero, Wojciech Jasiński, Marek Śmieja, Bartosz Zieliński"
  venue: ICCV
  venue_full: IEEE/CVF International Conference on Computer Vision
  year: 2025
  date: 2025-10-19
  status: published
  summary: >-
    Why do masked image models look weak out of the box? Their attention is spread almost
    uniformly over patches, so the [CLS] token aggregates them poorly. Selective
    Aggregation makes better use of the semantic information already present in the
    patch tokens.
  note: Also presented at the UniReps Workshop at NeurIPS 2025.
  image: beyond_cls.webp
  paper_url: https://arxiv.org/abs/2412.03215
  venue_url: https://openaccess.thecvf.com/content/ICCV2025/html/Przewiezlikowski_Beyond_cls_Exploring_the_True_Potential_of_Masked_Image_Modeling_ICCV_2025_paper.html
  code_url: https://github.com/gmum/beyond_cls
  featured: true
  featured_order: 1


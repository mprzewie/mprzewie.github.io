# Publications. See README.md ("Add a publication") for the field reference.
#
# - Keep entries newest first. The full list on /publications groups them by `year`
#   and keeps this file's order within each year.
# - `featured: true` shows a paper as a card under "Selected work" on the homepage,
#   ordered by `featured_order`. Every paper also appears in the "All publications" list.
# - `short_title` (optional) is used where space is tight; it defaults to the part of the
#   title before the first colon.
# - `authors` is one comma-separated string. Any name listed under `name_variants` in
#   _data/profile.yml is highlighted automatically. Mark equal contribution with a
#   trailing asterisk, e.g. "First Author*, Marcin Przewięźlikowski*".
# - `image` is a file name inside assets/img/pub/.
# - `paper_url` is the arXiv version when there is one, otherwise the published version.
#   `venue_url` is the published version (CVF Open Access or DOI); the venue badge links to it.
# - `status`: published (default, not shown), accepted, preprint, or under review.
#   Only list a paper as accepted/published once that is official.

- id: sparrta
  title: "SpaRRTa: A Synthetic Benchmark for Evaluating Spatial Intelligence in Visual Foundation Models"
  authors: "Turhan Can Kargin, Wojciech Jasiński, Adam Pardyl, Bartosz Zieliński, Marcin Przewięźlikowski"
  venue: IJCV
  venue_full: International Journal of Computer Vision
  year: 2026
  date: 2026-11-13
  status: published
  summary: >-
    Do frozen visual foundation models know where objects are relative to each other, from
    the camera's viewpoint and from another observer's? SpaRRTa probes this with
    photorealistic scenes with controllable object arrangements and free spatial
    annotations, and finds large differences in spatial awareness across popular models.
  note: Also presented at the 2nd Workshop on World Models, ICLR 2026.
  image: sparrta.webp
  paper_url: https://arxiv.org/abs/2601.11729
  venue_url: https://doi.org/10.1007/s11263-026-03112-7
  code_url: https://github.com/gmum/SpaRRTa
  project_url: https://sparrta.gmum.net/
  dataset_url: https://huggingface.co/datasets/turhancan97/SpaRRTa
  featured: true
  featured_order: 2

- id: seba
  title: "SeBA: Semi-supervised Few-shot Learning via Separated-at-Birth Alignment for Tabular Data"
  authors: "Kacper Jurek, Wojciech Batko, Marek Śmieja, Marcin Przewięźlikowski"
  venue: SDM
  venue_full: SIAM International Conference on Data Mining
  year: 2026
  date: 2026-11-12
  status: published
  summary: >-
    A joint-embedding approach to semi-supervised few-shot learning on tabular data that
    needs no hand-crafted augmentations: each sample is split into two complementary views,
    and the representations of one view are aligned with the nearest-neighbour structure
    of the other.
  note: A short version appeared at the EurIPS 2025 Workshop on AI for Tabular Data.
  image: seba.webp
  paper_url: https://arxiv.org/abs/2605.08519
  venue_url: https://doi.org/10.1137/1.9781611979329.33


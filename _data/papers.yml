- id: cassle
  short_title: CASSLE
  title: "Augmentation-aware Self-supervised Learning with Conditioned Projector"
  authors: "Marcin Przewięźlikowski, Mateusz Pyla, Bartosz Zieliński, Bartłomiej Twardowski, Jacek Tabor, Marek Śmieja"
  venue: KBS
  venue_full: Knowledge-Based Systems
  year: 2024
  date: 2024-11-05
  status: published
  summary: >-
    Invariance to augmentations can discard information that downstream tasks need, such
    as colour. CASSLE conditions the projector on the applied augmentations, so the encoder
    keeps that information. It works with common joint-embedding SSL methods without
    architectural changes.
  note: A short version appeared at the NeurIPS 2023 Workshop on Self-Supervised Learning.
  image: cassle.webp
  paper_url: https://arxiv.org/abs/2306.06082
  venue_url: https://doi.org/10.1016/j.knosys.2024.112572
  code_url: https://github.com/gmum/CASSLE
  poster_url: https://drive.google.com/file/d/1iFsDiXKdNvaXi8BKxw0WtI8g6BjydmAK/view?usp=sharing
  featured: true
  featured_order: 3


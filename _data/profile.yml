# Opening paragraphs of the Research section (Markdown).
bio: |
  My research is about learning representations of the visual world without human labels.
  I study what self-supervised models actually learn, how to make their representations
  more useful and spatially aware, and how to adapt them to new tasks with little data.
  The long-term goal is world models that understand their surroundings well enough to
  predict how they change.

  I've also spent four years as an ML engineer, shipping production computer vision for
  retail. I've submitted my PhD thesis at the Jagiellonian University and will defend it
  in December 2026.

# Research theme cards under the bio, left to right. `papers` lists paper ids from
# papers.yml: featured papers link to their card, others to the paper itself.
themes:
  - title: Self-supervised learning
    text: >-
      Learning visual representations without labels, and understanding what those
      representations capture.
    papers: [beyond-cls, cassle]
  - title: World models
    text: >-
      Spatially aware representations that capture how the world is structured and how it
      changes.
    papers: [sparrta]
  - title: Data efficiency
    text: >-
      Adapting models to new tasks and domains with as few labels as possible.
    papers: [hypershot, seba]


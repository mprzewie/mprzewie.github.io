# Site-wide settings. Restart `bundle exec jekyll serve` after editing this file.
# Personal details (name, affiliation, links, bio) live in _data/profile.yml.

title: Marcin Przewięźlikowski
tagline: AI researcher, self-supervised learning and world models
description: >-
  AI researcher working on self-supervised learning, visual foundation models and
  world models. GMUM, Jagiellonian University, Kraków.
url: https://mprzewie.github.io
baseurl: ""
lang: en

# How many news items the homepage shows (the rest are on /news).
home_news_count: 5

# Interactive patch grid behind the homepage header (assets/js/patches.js).
hero_patches: true

# jekyll-seo-tag
author:
  name: Marcin Przewięźlikowski
  twitter: pszwnzl
twitter:
  username: pszwnzl
  card: summary_large_image
social:
  name: Marcin Przewięźlikowski
  links:
    - https://scholar.google.com/citations?user=yQkER-MAAAAJ
    - https://github.com/mprzewie
    - https://www.linkedin.com/in/marcin-przewi%C4%99%C5%BAlikowski-aa5b82135/
    - https://x.com/pszwnzl
logo: /assets/img/portrait.jpg

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/social-card.png

theme: null
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - scripts

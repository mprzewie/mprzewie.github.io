{%- assign p = site.data.profile -%}
<footer class="site-footer">
  <div class="container site-footer__inner">
    <div>
      <p class="site-footer__name">{{ p.name }}</p>
      <p>{{ p.location }}</p>
    </div>
    {% include social-links.html compact=true %}
  </div>
  <div class="container">
    <p class="site-footer__meta">Last updated {{ site.time | date: "%B %Y" }}</p>
  </div>
</footer>
